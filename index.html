<style>
/* Layout: one-thumb phone app for short bursts. Everything you tap lives in the bottom half; settings stay folded away. */
:root{
  --bg:#EDF0F4; --surface:#FFFFFF; --ink:#141C2B; --muted:#5A6577; --line:#D3D9E2;
  --accent:#2A44C4; --accent-ink:#FFFFFF; --accent-soft:#DFE4FA;
  --good:#1C7A4B; --good-bg:#DCF1E5; --bad:#B0281F; --bad-bg:#F8DFDC;
  --b0:#C9CFD9; --b1:#AEBBEE; --b2:#8396E3; --b3:#5670D6; --b4:#1C7A4B;
  --display:"Newsreader", Georgia, "Times New Roman", serif;
  --body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E131A; --surface:#171F2A; --ink:#E5EAF2; --muted:#98A3B4; --line:#283343;
  --accent:#8FA2FF; --accent-ink:#0E131A; --accent-soft:#222D4A;
  --good:#6ED49B; --good-bg:#15342A; --bad:#FF8D84; --bad-bg:#3B1F1F;
  --b0:#2E3949; --b1:#33427A; --b2:#4559A8; --b3:#6C82E0; --b4:#4FBF84; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0E131A; --surface:#171F2A; --ink:#E5EAF2; --muted:#98A3B4; --line:#283343;
  --accent:#8FA2FF; --accent-ink:#0E131A; --accent-soft:#222D4A;
  --good:#6ED49B; --good-bg:#15342A; --bad:#FF8D84; --bad-bg:#3B1F1F;
  --b0:#2E3949; --b1:#33427A; --b2:#4559A8; --b3:#6C82E0; --b4:#4FBF84; color-scheme:dark }

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45;-webkit-tap-highlight-color:transparent;touch-action:manipulation;overscroll-behavior:none}
.app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding-inline:16px;padding-block:max(12px,env(safe-area-inset-top)) 0;box-sizing:border-box}
body{margin:0}[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;-webkit-user-select:none;user-select:none}
button:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1{font-family:var(--display);font-weight:600;margin:0;font-size:24px;letter-spacing:-.01em}
.label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.spacer{flex:1}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* bottom dock: the one place you tap to go */
.dock{position:sticky;bottom:0;display:flex;flex-direction:column;gap:6px;padding-block:12px max(14px,env(safe-area-inset-bottom,0px));background:var(--bg);margin-top:12px}
.primary{background:var(--accent);color:var(--accent-ink);border:0;border-radius:16px;padding:18px;font-size:19px;font-weight:700;width:100%;min-height:64px;display:flex;flex-direction:column;align-items:center;gap:2px}
.primary small{font-size:13.5px;font-weight:400;opacity:.85}
.secondary{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;font-size:16px;width:100%;min-height:50px}
.quiet{background:transparent;border:0;color:var(--muted);font-size:14px;padding:10px;text-decoration:underline;text-underline-offset:3px}
.danger{color:var(--bad);font-weight:700}

/* ---------- Home ---------- */
.home{display:flex;flex-direction:column;gap:14px;flex:1}
.lists{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.lists button{border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:14px 4px 10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-height:72px;position:relative}
.lists b{font-size:15.5px}
.lists small{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.lists .tick{position:absolute;top:4px;right:7px;font-size:11px;font-weight:700;line-height:1}
.lists button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.lists button[aria-pressed="true"] small{color:inherit;opacity:.85}
.hint{text-transform:none;letter-spacing:0;font-weight:400;margin-left:6px}
.hint.warn{color:var(--bad);font-weight:700}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
.big{font-family:var(--display);font-size:44px;line-height:1;font-variant-numeric:tabular-nums}
.big small{font-family:var(--body);font-size:15px;color:var(--muted);margin-left:6px}
.bar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--b0)}
.bar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
details.opts{background:var(--surface);border:1px solid var(--line);border-radius:16px}
details.opts summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;min-height:52px;cursor:pointer}
details.opts summary::-webkit-details-marker{display:none}
details.opts summary b{font-size:16px}
details.opts summary span{font-size:13.5px;color:var(--muted);text-align:right}
details.opts summary::after{content:"▾";color:var(--muted);font-size:14px}
details.opts[open] summary::after{content:"▴"}
.optbody{display:flex;flex-direction:column;gap:16px;padding:2px 16px 16px}
.group{display:flex;flex-direction:column;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:8px 13px;font-size:15px;min-height:42px}
.chip small{color:var(--muted);font-size:12px;margin-left:4px;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip[aria-pressed="true"] small{color:inherit;opacity:.8}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;border-radius:9px;padding:10px 4px;font-size:14.5px;min-height:44px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:0 0 0 1px var(--line)}
.reset-row{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}
.reset-row .quiet{padding:6px 10px;font-size:13px}
.settings{display:flex;flex-direction:column;gap:14px}
.settings .seg{background:var(--surface)}
.settings .seg button{min-height:52px;font-size:15px}
.settings .seg button[aria-pressed="true"]{background:var(--accent-soft);box-shadow:none}

/* ---------- Quiz ---------- */
.quiz{display:flex;flex-direction:column;gap:12px;flex:1}
.topbar{display:flex;align-items:center;gap:10px;min-height:44px}
.iconbtn{background:transparent;border:0;color:var(--muted);font-size:15px;min-width:44px;min-height:44px;padding:0 6px;display:inline-flex;align-items:center;gap:6px}
.track{flex:1;height:6px;background:var(--b0);border-radius:3px;overflow:hidden}
.track i{display:block;height:100%;background:var(--accent);transition:width .25s}
.count{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:40px;text-align:right}
.prompt{flex:1;display:flex;flex-direction:column;justify-content:center;gap:10px;padding-block:4px;min-height:110px}
.prompt .term{font-family:var(--display);font-size:clamp(36px,11vw,50px);line-height:1.08;font-weight:500;overflow-wrap:anywhere}
.prompt .def{font-size:22px;line-height:1.38}
.pos{display:inline-block;font-size:13px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:2px 8px;align-self:flex-start}
.ask{color:var(--muted);font-size:14px}
.again{color:var(--bad);font-size:13px;font-weight:700}
.feedback{min-height:24px;font-weight:700;font-size:16px}
.feedback.ok{color:var(--good)} .feedback.no{color:var(--bad)}
.choices{display:flex;flex-direction:column;gap:10px;padding-bottom:max(14px,env(safe-area-inset-bottom,0px))}
.choice{display:flex;gap:12px;align-items:center;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;min-height:64px;font-size:16.5px;line-height:1.35;width:100%}
.choice .txt{min-width:0}
.choice .txt.word{font-family:var(--display);font-size:23px;font-weight:500}
.choice .sense{display:block}
.choice .sense + .sense{margin-top:3px;color:var(--muted);font-size:15px}
.choice .mark{margin-left:auto;flex:none;font-weight:700;font-size:18px}
.choice.right{border-color:var(--good);background:var(--good-bg)}
.choice.right .mark{color:var(--good)}
.choice.wrong{border-color:var(--bad);background:var(--bad-bg)}
.choice.wrong .mark{color:var(--bad)}
.choice[aria-disabled]{cursor:default}
.choice.fade{opacity:.5}
.choice:not([aria-disabled]):active{transform:scale(.985)}
.cont{background:var(--accent);color:var(--accent-ink);border:0;border-radius:16px;min-height:64px;font-size:18px;font-weight:700;width:100%}

/* ---------- Summary ---------- */
.summary{display:flex;flex-direction:column;gap:14px;flex:1}
.score{font-family:var(--display);font-size:60px;line-height:1;font-variant-numeric:tabular-nums}
.score small{font-family:var(--body);font-size:17px;color:var(--muted);margin-left:6px}
.moves{font-size:15px;color:var(--muted)}
.missed{display:flex;flex-direction:column}
.missed div{padding:12px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:3px}
.missed b{font-family:var(--display);font-size:21px;font-weight:600}
.missed span{color:var(--muted);font-size:15px}

/* compact home so everything fits on one screen without scrolling */
.home{gap:12px}
.home .card{padding:12px 14px;gap:7px}
.home .big{font-size:36px}
.home .settings{gap:10px}
.home .group{gap:6px}
.home .settings .seg button{min-height:46px}
.lists button{min-height:62px;padding:12px 4px 8px}
.home .dock{margin-top:8px;padding-block:8px max(10px,env(safe-area-inset-bottom,0px));gap:4px}
.home .primary{min-height:58px;padding:12px}
.home .secondary{min-height:44px;padding:8px}
.home .reset-row .quiet{padding:4px 10px}
@media (max-height:700px){
  .home{gap:9px}
  .home .big{font-size:30px}
  .home .card{padding:10px 14px;gap:6px}
  .lists button{min-height:54px;padding:10px 4px 6px}
  .home .settings .seg button{min-height:42px;padding:6px 4px}
  .home .primary{min-height:52px;padding:9px}
  .home .secondary{min-height:40px}
  .home .legend{font-size:12.5px}
}

/* answer reveal: word, meaning and example after every answer */
.prompt.revealed{justify-content:flex-start;min-height:0;padding-top:2px}
.reveal{display:flex;flex-direction:column;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.rv-word{font-family:var(--display);font-size:28px;line-height:1.1;font-weight:500;overflow-wrap:anywhere}
.rv-def{display:flex;flex-direction:column;gap:2px;font-size:15.5px;line-height:1.35}
.rv-def span + span{color:var(--muted)}
.rv-def em{font-style:normal;font-weight:700;color:var(--accent)}
.rv-ex{border-top:1px solid var(--line);padding-top:7px;display:flex;flex-direction:column;gap:2px}
.rv-ex p{margin:0;font-family:var(--display);font-style:italic;font-size:17px;line-height:1.35}
.quiz.done .choice{min-height:50px;padding:9px 14px}
.quiz.done .choice .txt.word{font-size:20px}
.quiz.done .choice .sense + .sense{display:none}
@media (prefers-reduced-motion: reduce){ *{transition:none!important} .choice:active{transform:none!important} }
</style>

ing its honey with syrup."], ["adumbrate", "(v.) to outline, sketch / to foreshadow", "The opening chapter adumbrates the tragedy to come."], ["advocate", "(v.) to recommend, support publicly / (n.) supporter, champion", "She advocates for stronger environmental laws."], ["aerie", "(n.) a high nest of a bird of prey / a lofty, remote dwelling", "The writer retreated to her mountaintop aerie to finish the book."], ["aesthetic", "(adj.) relating to beauty or art / (n.) a set of artistic principles", "The building's design favors function over aesthetic appeal."], ["affable", "(adj.) friendly, easy to talk to", "The affable host made every guest feel welcome."], ["affectation", "(n.) behavior meant to impress, pretense, artificiality", "His British accent was an obvious affectation."], ["aggrandize", "(v.) to increase the power, wealth, or reputation of, exaggerate", "The dictator built statues to aggrandize himself."], ["aggregate", "(n.) a whole formed from parts, total / (v.) to combine, collect", "The aggregate of small donations exceeded a million dollars."], ["aghast", "(adj.) shocked, horrified", "She was aghast at the size of the bill."], ["alacrity", "(n.) cheerful eagerness, readiness", "He accepted the invitation with alacrity."], ["alchemy", "(n.) a seemingly magical transformation / medieval chemistry", "The chef's alchemy turned simple ingredients into a masterpiece."], ["alienate", "(v.) to make hostile or unfriendly, estrange", "His constant complaints began to alienate his coworkers."], ["alleviate", "(v.) to relieve, lessen", "The medicine helped alleviate her headache."], ["allusion", "(n.) an indirect reference", "The poem contains an allusion to Greek mythology."], ["aloof", "(adj.) distant, reserved, detached", "The new student seemed aloof, but she was just shy."], ["altruistic", "(adj.) unselfish, concerned for others", "Her altruistic donation funded the entire shelter."], ["amalgamate", "(v.) to combine, merge", "The two small banks amalgamated into one large firm."], ["ambiguous", "(adj.) unclear, open to more than one interpretation", "The ambiguous instructions led to several mistakes."], ["ambivalent", "(adj.) having mixed or conflicting feelings", "She felt ambivalent about moving away from her family."], ["ameliorate", "(v.) to improve, make better", "The new policy was meant to ameliorate conditions in the prisons."], ["amenable", "(adj.) agreeable, open to suggestion, compliant", "The landlord was amenable to lowering the rent."], ["amiable", "(adj.) friendly, pleasant", "The amiable waiter chatted with every table."], ["amorphous", "(adj.) shapeless, without clear form", "The plan remained an amorphous idea with no clear steps."], ["anachronism", "(n.) something out of its proper time period", "A wristwatch in a film about ancient Rome is an anachronism."], ["anachronistic", "(adj.) out of its proper time period, outdated", "His anachronistic views on women seemed to come from another century."], ["analogous", "(adj.) comparable, similar in some way", "The heart is analogous to a pump."], ["anarchy", "(n.) absence of government, disorder, chaos", "After the government collapsed, the country fell into anarchy."], ["anathema", "(n.) something hated or detested / a formal curse", "Laziness was anathema to the hardworking coach."], ["animosity", "(n.) hostility, strong dislike", "There was clear animosity between the two rivals."], ["annul", "(v.) to cancel, declare invalid", "The court annulled the marriage after just one month."], ["anodyne", "(adj.) bland, inoffensive / soothing, pain-relieving / (n.) a painkiller", "The speech was full of anodyne remarks that offended no one."], ["anoint", "(v.) to choose or designate, consecrate / to rub with oil", "The party anointed her as its chosen candidate."], ["anomalous", "(adj.) irregular, deviating from the norm", "The anomalous reading turned out to be a broken sensor."], ["anomaly", "(n.) a deviation from the norm, irregularity", "A snowy day in Jul     return {t, senses, pos:senses[0].pos, toks, ex: ex||""};
  });
}

const buzz = ms=>{ try{ navigator.vibrate && navigator.vibrate(ms); }catch(e){} };
const app = document.getElementById("app");
const dirLabel = {mixed:"Mixed", t2d:"Word → meaning", d2t:"Meaning → word"};
const savedRound = ()=> S.round && S.round.items && S.round.items.length ? S.round : null;

// ---------- home ----------
function home(){
  document.onkeydown=null; clearTimeout(autoT);
  const words=rangeWords(S.range);
  const n=[0,0,0,0,0], fresh=words.filter(w=>box(w)<0).length;
  words.forEach(w=>{ const b=box(w); if(b>=0) n[b]++; });
  const total=words.length, learning=n[0]+n[1]+n[2]+n[3];
  const seg=(c,v)=> v? `<i style="width:${v/total*100}%;background:var(${c})"></i>`:"";
  const rs=savedRound();
  const scope=selName(S.sel);
  app.innerHTML="";
  const el=$(`<main class="home">
    <h1 class="sr-only">GRE Word Drill</h1>
    <section class="group" aria-label="Word lists"><div class="label">Word lists <span class="hint" id="listHint">Pick one or more</span></div>
      <div class="lists">${LIST_KEYS.map(k=>`<button data-k="${k}" aria-pressed="${S.sel.includes(k)}"><span class="tick" aria-hidden="true">${S.sel.includes(k)?"✓":""}</span><b>${DECK_INFO[k].name}</b><small>${fmt(mastered(k))}/${fmt(DECKS[k].length)}</small></button>`).join("")}</div></section>
    <section class="card" aria-label="Progress">
      <div class="label">${esc(scope)}</div>
      <div class="big">${fmt(n[4])}<small>of ${fmt(total)} mastered</small></div>
      <div class="bar" role="img" aria-label="${n[4]} mastered, ${learning} learning, ${fresh} new">${seg("--b4",n[4])}${seg("--b3",n[3])}${seg("--b2",n[2])}${seg("--b1",n[1])}</div>
      <div class="legend"><span><i class="dot" style="background:var(--b4)"></i>${fmt(n[4])} mastered</span><span><i class="dot" style="background:var(--b2)"></i>${fmt(learning)} learning</span><span><i class="dot" style="background:var(--b0)"></i>${fmt(fresh)} new</span></div>
    </section>
    <section class="settings" aria-label="Round settings">
      <div class="group"><div class="label">Question type</div>
        <div class="seg">${Object.entries(dirLabel).map(([k,l])=>`<button data-d="${k}" aria-pressed="${S.dir===k}">${l}</button>`).join("")}</div></div>
      <div class="group"><div class="label">Questions per round</div>
        <div class="seg">${LENGTHS.map(v=>`<button data-l="${v}" aria-pressed="${S.len===v}">${v}</button>`).join("")}</div></div>
    </section>
    <div class="spacer"></div>
    <div class="dock">${rs
      ? `<button class="primary" id="resume">Resume round<small>${rs.items.length} question${rs.items.length>1?"s":""} left · ${esc(selName(rs.sel))}</small></button><button class="secondary" id="go">Start a new round instead</button>`
      : `<button class="primary" id="go">Start<small>${S.len} questions · ${esc(scope)}</small></button>`}<div class="reset-row" id="resetRow"><button class="quiet" id="reset">Reset progress for ${esc(scope==='All lists'?'all lists':scope)}</button></div></div>
  </main>`);
  app.append(el);
  el.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{ const k=b.dataset.k, on=S.sel.includes(k);
    if(on && S.sel.length===1){ const h=el.querySelector("#listHint"); h.textContent="Keep at least one list selected"; h.classList.add("warn"); return; }
    S.sel = on ? S.sel.filter(x=>x!==k) : LIST_KEYS.filter(x=>x===k || S.sel.includes(x)); WORDS=pool(S.sel); save(); home(); });
  el.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{ S.dir=b.dataset.d; save(); home(); });
  el.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>{ S.len=+b.dataset.l; save(); home(); });
  el.querySelector("#go").onclick=startRound;
  if(rs) el.querySelector("#resume").onclick=resumeRound;
  el.querySelector("#reset").onclick=()=>{
    const row=el.querySelector("#resetRow");
    row.innerHTML=`<span class="ask">Erase progress for ${esc(scope==='All lists'?'all lists':scope)}?</span><button class="quiet danger" id="yes">Erase</button><button class="quiet" id="no">Cancel</button>`;
    row.querySelector("#yes").onclick=()=>{ const p=P(); rangeWords(S.range).forEach(w=>delete p[w.t]); if(savedRound()) S.round=null; save(); home(); };
    row.querySelector("#no").onclick=home;
  };
}

// ---------- rounds: lowest boxes first, some new words, mastered words fill any gap ----------
let R=null, autoT=null;
function startRound(){
  const words=rangeWords(S.range), N=S.len;
  const learning=shuffle(words.filter(w=>box(w)>=0 && box(w)<MASTER)).sort((a,b)=>box(a)-box(b));
  const fresh=shuffle(words.filter(w=>box(w)<0));
  const done=shuffle(words.filter(w=>box(w)>=MASTER));
  const newCount=Math.min(Math.max(1,Math.round(N*NEW_SHARE)),fresh.length);
  let list=learning.slice(0, N-newCount);
  list=list.concat(fresh.slice(0, N-list.length));
  list=list.concat(done.slice(0, N-list.length));
  shuffle(list);
  R={ sel:[...S.sel], queue:list.map(w=>({w,retry:false})), total:list.length, done:0, firstTry:0, missed:[], up:0, down:0 };
  next();
}
function persistRound(cur){
  const items=(cur?[cur]:[]).concat(R.queue).map(x=>[x.w.t,x.retry?1:0,x.d||null,x.s==null?null:x.s]);
  S.round={ sel:R.sel, items, total:R.total, done:R.done, firstTry:R.firstTry, missed:R.missed, up:R.up, down:R.down };
  save();
}
function resumeRound(){
  const s=S.round, m=ALL;
  R={ sel:s.sel, queue:s.items.map(([t,r,d,si])=>({w:m.get(t),retry:!!r,d,s:si})).filter(x=>x.w), total:s.total, done:s.done, firstTry:s.firstTry, missed:s.missed||[], up:s.up||0, down:s.down||0 };
  next();
}

function makeQuestion(w, keep){
  const dir = keep && keep.d ? keep.d : S.dir==="mixed" ? (Math.random()<.5?"t2d":"d2t") : S.dir;
  const sense = keep && keep.s!=null && w.senses[keep.s] ? w.senses[keep.s] : pick(w.senses);
  const want = dir==="d2t" ? sense.pos : w.pos;
  const chosen=[];
  for(let i=0;i<600 && chosen.length<3;i++){
    const c=pick(WORDS);
    if(c===w || chosen.includes(c) || clash(w,c) || chosen.some(x=>clash(x,c))) continue;
    if(i<400 && c.pos!==want) continue;           // prefer the same part of speech
    chosen.push(c);
  }
  return { w, dir, sense, options: shuffle([w,...chosen]) };
}

function next(){
  clearTimeout(autoT);
  if(!R.queue.length) return summary();
  const item=R.queue.shift();
  const q=makeQuestion(item.w, item);
  item.d=q.dir; item.s=q.w.senses.indexOf(q.sense);
  persistRound(item);                               // closing the app now resumes on this exact question
  app.innerHTML="";
  const prompt = q.dir==="t2d"
    ? `<span class="ask">Pick the meaning</span><div class="term" lang="en">${esc(q.w.t)}</div>`
    : `<span class="ask">Pick the word</span>${q.sense.pos?`<span class="pos">${q.sense.pos}.</span>`:""}<div class="def">${esc(q.sense.text)}</div>`;
  const opt = (o,i)=> q.dir==="t2d"
    ? `<button class="choice" data-i="${i}"><span class="txt">${o.senses.map(s=>`<span class="sense">${s.pos?`<em>${s.pos}.</em> `:""}${esc(s.text)}</span>`).join("")}</span><span class="mark" aria-hidden="true"></span></button>`
    : `<button class="choice" data-i="${i}"><span class="txt word">${esc(o.t)}</span><span class="mark" aria-hidden="true"></span></button>`;
  const el=$(`<main class="quiz">
    <div class="topbar"><button class="iconbtn" id="pause" aria-label="Pause and go home">❚❚ Pause</button>
      <div class="track"><i style="width:${R.done/R.total*100}%"></i></div><span class="count">${Math.min(R.done+1,R.total)}/${R.total}</span></div>
    <section class="prompt">${item.retry?`<span class="again">Try this one again</span>`:""}${prompt}</section>
    <div class="feedback" id="fb" aria-live="polite"></div>
    <section class="choices" id="choices">${q.options.map(opt).join("")}</section>
  </main>`);
  app.append(el);
  const btns=[...el.querySelectorAll(".choice")];
  let answered=false;
  const go=()=>{ if(answered){ answered=false; next(); } };
  const answer=(i)=>{
    if(answered) return; answered=true;
    const ok=q.options[i]===q.w;
    btns.forEach((b,j)=>{ b.setAttribute("aria-disabled","true"); if(q.options[j]===q.w){ b.classList.add("right"); b.querySelector(".mark").textContent="✓"; } else if(j===i){ b.classList.add("wrong"); b.querySelector(".mark").textContent="✕"; } else b.classList.add("fade"); });
    const fb=el.querySelector("#fb");
    const prog=P(), prev=prog[q.w.t]||[-1,0];
    let b = prev[0]<0 ? 0 : prev[0];
    if(!item.retry) R.done++;
    if(ok){ b=Math.min(MASTER,b+1); R.up++; fb.textContent="Correct"; fb.className="feedback ok"; if(!item.retry && !R.missed.includes(q.w.t)) R.firstTry++; }
    else { if(prev[0]>0) R.down++; b=0; fb.textContent=`It's “${q.w.t}”`; fb.className="feedback no"; buzz(40);
      if(!R.missed.includes(q.w.t)) R.missed.push(q.w.t); R.queue.splice(Math.min(RETRY_GAP,R.queue.length),0,{w:q.w,retry:true}); }
    prog[q.w.t]=[b,prev[1]+1];
    persistRound(null);
    el.querySelector(".track i").style.width=(R.done/R.total*100)+"%";
    // after every answer, right or wrong, swap the question for the word, its meaning and an example sentence
    const pr=el.querySelector(".prompt");
    pr.classList.add("revealed");
    el.classList.add("done");
    pr.innerHTML=`<div class="reveal"><div class="rv-word">${esc(q.w.t)}</div>`+
      `<div class="rv-def">${q.w.senses.map(s=>`<span>${s.pos?`<em>${s.pos}.</em> `:""}${esc(s.text)}</span>`).join("")}</div>`+
      (q.w.ex?`<div class="rv-ex"><span class="label">Example</span><p>${esc(q.w.ex)}</p></div>`:"")+`</div>`;
    // every answer waits for Continue (or a tap anywhere), right or wrong
    const c=$(`<button class="cont" id="cont">Continue</button>`); el.querySelector("#choices").append(c); c.onclick=go; c.focus({preventScroll:true});
  };
  btns.forEach(b=>b.onclick=(e)=>{ e.stopPropagation(); if(answered) go(); else answer(+b.dataset.i); });
  el.addEventListener("click",(e)=>{ if(answered && !e.target.closest("#pause")) go(); });   // tap anywhere to continue
  el.querySelector("#pause").onclick=(e)=>{ e.stopPropagation(); clearTimeout(autoT); if(answered) persistRound(null); R=null; home(); };
  document.onkeydown=(e)=>{ if(!/^[1-4]$/.test(e.key) && e.key!=="Enter" && e.key!==" ") return; if(!answered && /^[1-4]$/.test(e.key)) answer(+e.key-1); else if(answered){ e.preventDefault(); go(); } };
}

function summary(){
  document.onkeydown=null; clearTimeout(autoT);
  S.round=null; save();
  const missed=R.missed.map(t=>ALL.get(t)).filter(Boolean);
  app.innerHTML="";
  const el=$(`<main class="summary">
    <div class="label">Round done · ${esc(selName(R.sel))}</div>
    <div class="score">${R.firstTry}<small>of ${R.total} right first try</small></div>
    <div class="moves">${R.up} moved up a box · ${R.down} dropped back to Box 0</div>
    ${missed.length?`<div class="label">Words you missed</div><div class="missed">${missed.map(w=>`<div><b>${esc(w.t)}</b><span>${w.senses.map(s=>(s.pos?s.pos+". ":"")+esc(s.text)).join(" / ")}</span></div>`).join("")}</div>`:`<div class="ask">No misses this round.</div>`}
    <div class="spacer"></div>
    <div class="dock"><button class="primary" id="again">Keep going<small>${S.len} more questions</small></button><button class="secondary" id="home">Done for now</button></div>
  </main>`);
  app.append(el);
  el.querySelector("#again").onclick=startRound;
  el.querySelector("#home").onclick=()=>{ R=null; home(); };
}

home();
</script>
<script>
if("serviceWorker" in navigator){ addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{})); }
try{ navigator.storage && navigator.storage.persist && navigator.storage.persist(); }catch(e){}
</script>
</body>
</html>
